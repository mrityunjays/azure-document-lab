name: API CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore DocumentLab.sln

      - name: Build
        run: dotnet build DocumentLab.sln --configuration Release --no-restore

      - name: Run tests
        run: dotnet test DocumentLab.sln --configuration Release --no-build